name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r did-api-gateway/requirements.txt -r did-api-vendor/backend/requirements.txt pytest
      - run: python -m compileall -q did-api-gateway did-api-vendor
      - name: Gateway tests
        run: python -m pytest -q
        working-directory: did-api-gateway
      - name: Vendor tests
        run: python -m pytest -q
        working-directory: did-api-vendor
