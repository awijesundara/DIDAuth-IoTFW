; PlatformIO project file for the DIDAuth-IoTFW ESP32 example.
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; arduino-esp32 core 3.x (ESP-IDF 5.x toolchain)
platform_packages =
    framework-arduinoespressif32

monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1

; SPIFFS is used for credential/firmware storage by this sketch.
board_build.filesystem = spiffs

lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.3.5
